<body>
  <template id="__bundler_thumbnail" data-bg-color="#1F1F1F">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#1F1F1F"/>
      <circle cx="600" cy="380" r="120" fill="#E26464"/>
      <text x="600" y="600" font-family="Albert Sans, sans-serif" font-size="80" font-weight="700" fill="#fff" text-anchor="middle">Thuc Ngo</text>
    </svg>
  </template>

  <div id="root"></div>

  <script>
    // Resolve an "assets/..." key to its blob URL produced by the bundler.
    // Falls back to the original path during local development.
    window.__R = function (key) {
      const r = window.__resources;
      return (r && r[key]) || key;
    };
  </script>

  <script type="text/babel" src="_standalone_tweaks-panel.jsx"></script>
  <script type="text/babel" src="_standalone_PillButton.jsx"></script>
  <script type="text/babel" src="_standalone_Nav.jsx"></script>
  <script type="text/babel" src="_standalone_SectionHeading.jsx"></script>
  <script type="text/babel" src="_standalone_Hero.jsx"></script>
  <script type="text/babel" src="_standalone_ProjectCard.jsx"></script>
  <script type="text/babel" src="_standalone_StatCard.jsx"></script>
  <script type="text/babel" src="_standalone_ContactForm.jsx"></script>
  <script type="text/babel" src="_standalone_Footer.jsx"></script>
  <script type="text/babel" src="_standalone_Pages.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "heroVariant": "gradient",
      "gradientTone": "warm"
    }/*EDITMODE-END*/;

    function App() {
      const [page, setPage] = React.useState("Home");
      const [projectId, setProjectId] = React.useState(null);
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      const navigate = (p) => {
        setPage(p);
        setProjectId(null);
        window.scrollTo({ top: 0, behavior: "instant" });
      };
      const openProject = (id) => {
        setProjectId(id);
        setPage("ProjectDetail");
        window.scrollTo({ top: 0, behavior: "instant" });
      };

      let content;
      if (page === "Home") content = <HomePage onNavigate={navigate} onProject={openProject} heroVariant={tweaks.heroVariant} gradientTone={tweaks.gradientTone} />;
      else if (page === "Portfolio") content = <PortfolioPage onNavigate={navigate} onProject={openProject} />;
      else if (page === "ProjectDetail") content = <PortfolioDetailPage projectId={projectId} onNavigate={navigate} onProject={openProject} />;
      else if (page === "About Me") content = <AboutMePage onNavigate={navigate} onProject={openProject} />;
      else if (page === "Contact") content = <ContactPage onNavigate={navigate} />;

      return (
        <div data-screen-label={"00 " + (page === "ProjectDetail" ? "Project Detail" : page)}>
          <Nav active={page === "ProjectDetail" ? "Portfolio" : page} onNavigate={navigate} />
          <div className="rsh-page" key={page + (projectId || "")}>
            {content}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
